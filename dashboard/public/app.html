<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Astra Voice , Console</title>
<meta name="description" content="Astra Voice console. Build and preview AI voice agents from ₹1/min for the promotional AI layer; telephony and carrier charges are separate." />
<meta name="theme-color" content="#F7F9FC" />
<link rel="icon" href="/assets/favicon.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/brand.css?v=20261001-polish1" />
<link rel="stylesheet" href="/assets/app.css?v=20261001-voice-lock-table" />
<link rel="stylesheet" href="/assets/ai-employee-journey.css?v=20261001-polish1" />
</head>
<body class="grain theme-premium-light">

<!-- Background atmosphere (shared with marketing for one cohesive product) -->
<div class="atmos" aria-hidden="true">
  <span class="glow g1"></span><span class="glow g2"></span><span class="glow g3"></span>
</div>

<!-- No-JS notice. The console is an authenticated SPA and needs JavaScript. -->
<noscript>
  <div class="nojs">
    <strong>JavaScript is required.</strong>
    The Astra Voice console is an interactive app. Please enable JavaScript to sign in and manage your agents.
  </div>
</noscript>

<!-- App root. Everything below is rendered by app.js. The skeleton here keeps the
     first paint premium even before scripts run. It is replaced on boot. -->
<div id="app" class="app-root" aria-busy="true">
  <div class="boot">
    <div class="boot-mark" aria-hidden="true">
      <img src="/assets/brand/astra-voice-ac-mark.png" alt="" width="40" height="40" />
    </div>
    <div class="boot-text">Starting console<span class="spin boot-spin"></span></div>
  </div>
</div>

<!-- Toast stack -->
<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

<!-- Modal host -->
<div id="modal-host" class="modal-host hide" aria-hidden="true"></div>

<script src="/assets/app.js?v=20261001-voice-lock-table" defer></script>
<script src="/assets/ai-employee-journey.js?v=20261001-polish1" defer></script>
</body>
</html>
